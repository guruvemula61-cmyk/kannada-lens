<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kannada Lens – Kannada Text Digitization</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>ಕ</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600&family=Fraunces:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f1b16;--mute:#6b6257;--line:#ded4c2;--brand:#b3261e;--brand-ink:#fff;--mark:#ffe08a;--ok:#1d6b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16130f;--card:#201c17;--ink:#f1ebdf;--mute:#a79d8d;--line:#3a332a;--brand:#e5574d;--brand-ink:#16130f;--mark:#6b5410;--ok:#6fcf97}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Kannada",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font:800 clamp(2rem,6vw,3.2rem)/1.1 Fraunces,Georgia,serif;margin:8px 0 4px}
h1 .kn{color:var(--brand);font-family:"Noto Sans Kannada",sans-serif}
.sub{color:var(--mute);margin:0 0 20px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
label{font-weight:600;display:block;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:10px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer;display:inline-block}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input[type=file]{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px}
.tab{background:none;color:var(--mute);border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:0}
.tab[aria-selected=true]{color:var(--ink);background:var(--card);border-color:var(--line)}
.panel[hidden]{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs span{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--mute)}
.res h3{margin:0 0 4px;font-size:1.1rem}
.meta{color:var(--mute);font-size:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.res img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.kn-text{white-space:pre-wrap;font-size:1.2rem;line-height:1.8;background:var(--bg);border-radius:6px;padding:12px;max-height:260px;overflow:auto}
.sec-title{font-weight:600;margin:12px 0 2px}
.kw span{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0;font-size:14px}
.note{border-left:4px solid var(--brand);padding:6px 10px;background:var(--bg);margin-top:10px}
mark{background:var(--mark);color:inherit;padding:0 2px}
.err{color:var(--brand);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:24px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="kn">ಕನ್ನಡ</span> Lens</h1>
  <p class="sub">Photograph a Kannada signboard, scanned page or handwritten note. Get editable Kannada text, how to read it, and what it means in English.</p>

  <div class="card">
    <label for="key">Gemini API key</label>
    <input id="key" type="password" placeholder="Paste your key (starts with AIza…)" autocomplete="off">
    <p class="meta" style="margin:6px 0 0">Free key at aistudio.google.com/apikey. It stays in your browser and is sent only to Google.</p>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-p="scan">Digitize</button>
    <button class="tab" role="tab" aria-selected="false" data-p="search">Search</button>
    <button class="tab" role="tab" aria-selected="false" data-p="lib">Library</button>
  </div>

  <section id="scan" class="panel">
    <div class="card">
      <div class="row">
        <label class="btn sec" for="f1" style="margin:0">Choose image or PDF</label>
        <label class="btn sec" for="f2" style="margin:0">Use camera</label>
        <button id="go" disabled>Digitize</button>
      </div>
      <input id="f1" type="file" accept="image/*,application/pdf" multiple>
      <input id="f2" type="file" accept="image/*" capture="environment">
      <div id="thumbs" class="thumbs"></div>
      <p id="status" class="meta" role="status"></p>
    </div>
    <div id="results"></div>
  </section>

  <section id="search" class="panel" hidden>
    <div class="card">
      <label for="q">Search in Kannada, Roman letters or English</label>
      <input id="q" type="text" placeholder="e.g. ಬಸ್, bus, temple">
    </div>
    <div id="hits"></div>
  </section>

  <section id="lib" class="panel" hidden>
    <div class="card row"><button id="exp" class="sec">Export all as JSON</button><button id="clr" class="sec">Clear library</button><span id="count" class="meta"></span></div>
    <div id="libList"></div>
  </section>
</div>

<script>
const MODELS = ["gemini-3.8-flash", "gemini-3.7-flash"]; // tried in order
const PROMPT = `You are an expert Kannada OCR and language assistant.
Read ALL Kannada (and any English) text in the attached image/document.
Return ONLY valid JSON with exactly these keys:
{"document_type":"printed | handwritten | signboard | scanned page | other",
"kannada_text":"full extracted text in Kannada script, keep line breaks as \\n",
"transliteration":"Roman (English letters) reading of the Kannada text, line by line",
"english_translation":"natural English translation",
"simple_explanation":"2-3 simple sentences explaining what this text is about / where it is used",
"keywords":["5-10 important Kannada words from the text"],
"confidence":"high | medium | low",
"notes":"mention unclear/damaged parts, or empty string"}
Do not invent text that is not visible. If no Kannada text is found, say so in notes and leave kannada_text empty.`;

const $ = id => document.getElementById(id);
let pending = [];           // {name, mime, b64, url}
let docs = [];              // results (kept in memory + localStorage without images)

// ---- safe storage ----
const store = {
  get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch(e){} }
};
$("key").value = store.get("kl_key") || "";
$("key").addEventListener("change", e => store.set("kl_key", e.target.value.trim()));
try { docs = JSON.parse(store.get("kl_docs") || "[]") } catch(e){ docs = [] }

// ---- tabs ----
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== t.dataset.p);
  if (t.dataset.p === "lib") renderLib();
  if (t.dataset.p === "search") renderHits();
});

// ---- files ----
function toB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("Could not read file"));
    r.readAsDataURL(file);
  });
}
async function addFiles(list){
  for (const f of list){
    const mime = f.type || (f.name.toLowerCase().endsWith(".pdf") ? "application/pdf" : "image/jpeg");
    pending.push({ name: f.name || "camera.jpg", mime, b64: await toB64(f), url: mime.startsWith("image") ? URL.createObjectURL(f) : null });
  }
  $("thumbs").replaceChildren(...pending.map(p => Object.assign(document.createElement("span"), { textContent: p.name })));
  $("go").disabled = !pending.length;
}
$("f1").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("f2").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };

// ---- Gemini ----
async function digitize(p, key){
  let lastErr;
  for (const model of MODELS){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ inline_data: { mime_type: p.mime, data: p.b64 } }, { text: PROMPT }] }],
        generationConfig: { responseMimeType: "application/json" }
      })
    });
    const j = await r.json();
    if (r.ok){
      const t = (j.candidates?.[0]?.content?.parts?.[0]?.text || "").replace(/^```json|```$/g, "").trim();
      return JSON.parse(t);
    }
    lastErr = new Error(j.error?.message || "API error " + r.status);
    // only try the next model when this one is unavailable
    if (![404, 400].includes(r.status) && !/no longer available|not found|not supported/i.test(lastErr.message)) break;
  }
  throw lastErr;
}

$("go").onclick = async () => {
  const key = $("key").value.trim();
  store.set("kl_key", key);
  if (!key){ $("status").innerHTML = '<span class="err">Add your Gemini API key above first.</span>'; return; }
  $("go").disabled = true;
  const batch = pending; pending = []; $("thumbs").replaceChildren();
  for (const p of batch){
    $("status").textContent = "Reading " + p.name + " …";
    try {
      const r = await digitize(p, key);
      const d = { id: Date.now() + Math.random(), name: p.name, time: new Date().toLocaleString(), img: p.url, ...r };
      docs.unshift(d);
      save();
      renderResult(d, true);
    } catch(e){
      const s = document.createElement("div"); s.className = "card err"; s.textContent = p.name + ": " + e.message;
      $("results").prepend(s);
    }
  }
  $("status").textContent = "Done. Results are saved in Search and Library.";
};

function save(){
  store.set("kl_docs", JSON.stringify(docs.map(({ img, ...rest }) => rest)));
}

// ---- rendering (textContent only, so model output can't inject HTML) ----
function el(tag, props = {}, ...kids){
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach(k => e.append(k));
  return e;
}
function dl(name, text, type = "text/plain"){
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" })), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}
function renderResult(d, prepend){
  const kw = el("div", { className: "kw" }, ...(d.keywords || []).map(k => el("span", { textContent: k })));
  const left = d.img ? el("div", {}, el("img", { src: d.img, alt: d.name })) : el("div", { className: "meta", textContent: "PDF – preview not shown" });
  const copy = el("button", { className: "sec", textContent: "Copy Kannada text" });
  copy.onclick = async () => { try { await navigator.clipboard.writeText(d.kannada_text || ""); copy.textContent = "Copied"; } catch(e){ copy.textContent = "Copy failed"; } };
  const txt = el("button", { className: "sec", textContent: "Download .txt" });
  txt.onclick = () => dl(d.name.replace(/\.[^.]+$/, "") + "_kannada.txt", d.kannada_text || "");
  const card = el("div", { className: "card res" },
    el("h3", { textContent: d.name }),
    el("div", { className: "meta", textContent: `${d.document_type || ""} · confidence: ${d.confidence || "n/a"}` }),
    el("div", { className: "grid" }, left,
      el("div", {}, el("div", { className: "sec-title", textContent: "Kannada text" }), el("div", { className: "kn-text", textContent: d.kannada_text || "(no text found)" }))),
    el("div", { className: "sec-title", textContent: "How to read it" }), el("div", { textContent: d.transliteration || "" }),
    el("div", { className: "sec-title", textContent: "English" }), el("div", { textContent: d.english_translation || "" }),
    el("div", { className: "sec-title", textContent: "What it is" }), el("div", { textContent: d.simple_explanation || "" }),
    el("div", { className: "sec-title", textContent: "Keywords" }), kw,
    d.notes ? el("div", { className: "note", textContent: d.notes }) : "",
    el("div", { className: "row", style: "margin-top:12px" }, copy, txt));
  $("results")[prepend ? "prepend" : "append"](card);
}

// ---- search ----
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function hl(line, q){
  const frag = document.createDocumentFragment();
  line.split(new RegExp("(" + esc(q) + ")", "i")).forEach(part => {
    frag.append(part.toLowerCase() === q.toLowerCase() ? el("mark", { textContent: part }) : document.createTextNode(part));
  });
  return frag;
}
function renderHits(){
  const q = $("q").value.trim(), out = $("hits");
  out.replaceChildren();
  if (!docs.length){ out.append(el("div", { className: "empty", textContent: "Digitize a document first, then search it here." })); return; }
  if (!q) return;
  let n = 0;
  docs.forEach(d => {
    const fields = { Kannada: d.kannada_text, Reading: d.transliteration, English: d.english_translation };
    const lines = [];
    for (const [k, v] of Object.entries(fields))
      (v || "").split("\n").forEach(l => { if (l.toLowerCase().includes(q.toLowerCase())) lines.push(el("div", {}, el("b", { textContent: k + ": " }), hl(l, q))); });
    if (lines.length){ n++; out.append(el("div", { className: "card" }, el("h3", { textContent: d.name }), el("div", { className: "meta", textContent: d.time }), ...lines)); }
  });
  if (!n) out.append(el("div", { className: "empty", textContent: "No matches. Try another spelling or an English word." }));
}
$("q").oninput = renderHits;

// ---- library ----
function renderLib(){
  $("count").textContent = docs.length + " document" + (docs.length === 1 ? "" : "s");
  const out = $("libList"); out.replaceChildren();
  if (!docs.length){ out.append(el("div", { className: "empty", textContent: "Nothing saved yet. Digitize a document to start your library." })); return; }
  docs.forEach(d => out.append(el("details", { className: "card" },
    el("summary", { textContent: d.name + " – " + d.time }),
    el("div", { className: "kn-text", textContent: d.kannada_text || "" }),
    el("div", { className: "meta", textContent: d.english_translation || "" }))));
}
$("exp").onclick = () => dl("kannada_lens_library.json", JSON.stringify(docs.map(({ img, ...r }) => r), null, 2), "application/json");
$("clr").onclick = () => { if (confirm("Delete all saved documents?")){ docs = []; save(); renderLib(); } };
</script>
</body>
</html>
